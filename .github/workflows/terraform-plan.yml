# Executa `terraform plan` a cada Pull Request para a main (e manualmente via
# workflow_dispatch) e publica o resultado como comentário no PR.
#
# Secrets necessários (GitHub → Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID        → Access Key das credenciais temporárias do Learner Lab
#   AWS_SECRET_ACCESS_KEY    → Secret Key das credenciais temporárias do Learner Lab
#   AWS_SESSION_TOKEN        → Session Token (obrigatório no Learner Lab, credenciais STS)
#   TF_VAR_DB_PASSWORD       → senha do RDS (substitui o terraform.tfvars, que não vai para o Git)
#   TF_VAR_SSH_ALLOWED_CIDR  → IP autorizado no SSH, no formato x.x.x.x/32
#
# As credenciais do Learner Lab expiram em ~4 horas: atualize os três secrets
# AWS_* antes de abrir ou atualizar o PR.

name: Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:

# Permissões mínimas: ler o código e escrever o comentário no PR.
permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    # Variáveis obrigatórias do Terraform vindas dos secrets. O Terraform lê
    # automaticamente variáveis de ambiente com prefixo TF_VAR_.
    env:
      TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
      TF_VAR_ssh_allowed_cidr: ${{ secrets.TF_VAR_SSH_ALLOWED_CIDR }}
      TF_IN_AUTOMATION: "true"

    steps:
      # Faz o checkout do código para o runner ter acesso aos arquivos Terraform
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # Injeta as credenciais temporárias do Learner Lab (inclui o session token)
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # Instala o Terraform CLI. O wrapper fica desligado para o exit code e a
      # saída do plan chegarem sem alteração aos steps seguintes.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # Inicializa o diretório raiz do Terraform e baixa o provider AWS.
      # O projeto usa estado local, então não há backend remoto para configurar.
      - name: Terraform Init
        run: terraform init -input=false -no-color

      # Valida a sintaxe e a consistência da configuração
      - name: Terraform Validate
        run: terraform validate -no-color

      # Gera o plano. Exit code 1 = erro; o resultado é salvo em plan.txt para
      # o comentário. continue-on-error deixa o comentário ser publicado mesmo
      # com erro; o último step faz o job falhar nesse caso.
      - name: Terraform Plan
        id: plan
        continue-on-error: true
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -out=tfplan 2>&1 | tee plan.txt

      # Mostra o plano no resumo da execução, na aba Actions
      - name: Publicar resumo do plano
        if: always()
        run: |
          {
            echo "## Terraform Plan: ${{ steps.plan.outcome }}"
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Publica o plano como comentário no Pull Request
      - name: Comentar o plano no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            if (plan.length > 60000) {
              plan = '... (saída truncada)\n' + plan.slice(-60000);
            }
            const outcome = '${{ steps.plan.outcome }}' === 'success' ? '✅ sucesso' : '❌ falhou';
            const body = [
              `### Terraform Plan: ${outcome}`,
              `Commit: \`${context.sha.substring(0, 7)}\``,
              '<details><summary>Ver o plano</summary>',
              '',
              '```',
              plan,
              '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # Garante exit code diferente de zero quando o terraform plan falha
      - name: Falhar se o plan retornou erro
        if: steps.plan.outcome == 'failure'
        run: |
          echo "terraform plan retornou erro. Veja o log do step 'Terraform Plan'."
          exit 1